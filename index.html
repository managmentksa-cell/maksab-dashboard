.theme-toggle:hover{border-color:var(--accent)}
.theme-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s ease}
[data-theme=dark] .theme-toggle .sun{display:none}
[data-theme=light] .theme-toggle .moon{display:none}
:root:not([data-theme]) .theme-toggle .moon{display:none}

/* Smooth theme transition */
html.theme-trans,html.theme-trans *,html.theme-trans *::before,html.theme-trans *::after{transition:background .3s ease,color .2s ease,border-color .3s ease,box-shadow .3s ease !important}

call('tgSave',rows,by2,why).then(function(r){TG=P(r);TGM.edit=m;TGMSG=T('تم الحفظ وسُجّل في سجل التعديلات','Saved and logged');tgRender()}).catch(function(e){var b=$('#tgSave',s);if(b)b.disabled=false;msg.className='m2-err';msg.textContent=String(e.message||e).replace(/^Error:\s*/,'')})}}

function selectBtn(g){$$('button[data-t]',nav).forEach(function(b){var v=String(b===g.b);if(b.getAttribute('aria-selected')!==v)b.setAttribute('aria-selected',v)})}

<script>
/* === REDESIGN: Sidebar, Theme Toggle, New Tabs === */
(function(){
"use strict";
var $=function(s){return document.getElementById(s)};
var TAB_TITLES={ov:'نظرة عامة',y26:'التحليل بالتفصيل',y27:'2027',pr:'التسعير',av:'المؤكد والمتاح',ota:'المنصات',al:'التنبيهات',rec:'التوصيات',usr:'إدارة المستخدمين'};
var ALL_TABS=['ov','y26','y27','pr','av','ota','al','rec','usr'];

/* --- Theme Toggle --- */
var themeBtn=$('themeBtn');
function getTheme(){try{return localStorage.getItem('mm_theme')}catch(e){return null}}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('mm_theme',t)}catch(e){}
}
function initTheme(){
  var saved=getTheme();
  if(saved){applyTheme(saved)}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches){
    document.documentElement.setAttribute('data-theme','dark');
  }else{
    document.documentElement.setAttribute('data-theme','light');
  }
}
initTheme();
if(themeBtn){themeBtn.addEventListener('click',function(){
  document.documentElement.classList.add('theme-trans');
  var cur=document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark'?'light':'dark');
  setTimeout(function(){document.documentElement.classList.remove('theme-trans')},400);
})}

/* --- Sidebar Toggle --- */
var sidebar=$('sidebar'),backdrop=$('sbBackdrop'),menuBtn=$('tbMenu');
function openSidebar(){sidebar.classList.add('open');backdrop.classList.add('show')}
function closeSidebar(){sidebar.classList.remove('open');backdrop.classList.remove('show')}
if(menuBtn)menuBtn.addEventListener('click',function(){sidebar.classList.contains('open')?closeSidebar():openSidebar()});
if(backdrop)backdrop.addEventListener('click',closeSidebar);

/* --- Sidebar Navigation --- */
var sidebarNav=$('sidebarNav');
if(sidebarNav){sidebarNav.addEventListener('click',function(e){
  var btn=e.target.closest('button[data-t]');
  if(!btn)return;
  var t=btn.dataset.t;
  // Update sidebar active state
  sidebarNav.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b.dataset.t===t)});
  // Update topbar title
  var tbTitle=$('tbTitle');
  if(tbTitle)tbTitle.textContent=TAB_TITLES[t]||t;
  // Trigger existing tab system for standard tabs
  var stdTabs=['ov','y26','y27','pr','av','ota','al'];
  if(stdTabs.indexOf(t)!==-1){
    // Click the original tab button
    var origBtn=document.querySelector('#tabs button[data-t="'+t+'"]');
    if(origBtn)origBtn.click();
    // Also hide new sections
    var recSec=$('s-rec'),usrSec=$('s-usr');
    if(recSec)recSec.hidden=true;
    if(usrSec)usrSec.hidden=true;
  }else{
    // Hide all standard sections
    stdTabs.forEach(function(st){var sec=$('s-'+st);if(sec)sec.hidden=true});
    // Show the new section
    ALL_TABS.forEach(function(at){
      if(at!=='ov'&&at!=='y26'&&at!=='y27'&&at!=='pr'&&at!=='av'&&at!=='ota'&&at!=='al'){
        var sec=$('s-'+at);if(sec)sec.hidden=(at!==t);
      }
    });
    // Deselect original tabs
    document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-selected','false')});
    // Load section content
    if(t==='rec')loadRecommendations();
    if(t==='usr')loadUsers();
  }
  closeSidebar();
})}

/* --- Sync sidebar with original tabs --- */
var origTabs=document.querySelector('#tabs');
if(origTabs){
  var observer=new MutationObserver(function(){
    var active=origTabs.querySelector('button[aria-selected=true]');
    if(active&&sidebarNav){
      sidebarNav.querySelectorAll('button').forEach(function(b){
        b.classList.toggle('active',b.dataset.t===active.dataset.t);
      });
      var tbTitle=$('tbTitle');
      if(tbTitle)tbTitle.textContent=TAB_TITLES[active.dataset.t]||'';
    }
  });
  observer.observe(origTabs,{subtree:true,attributes:true,attributeFilter:['aria-selected']});
}

/* --- Sync status dots and refresh --- */
function syncStatus(){
  var d1=$('statDot'),d2=$('statDot2'),t1=$('statTxt'),t2=$('statTxt2');
  if(d1&&d2)d2.className=d1.className;
  if(t1&&t2)t2.textContent=t1.textContent;
}
setInterval(syncStatus,500);
var ref2=$('btnRefresh2'),ref1=$('btnRefresh');
if(ref2&&ref1){ref2.addEventListener('click',function(){ref1.click()})}

/* --- Sync alert badge --- */
function syncBadge(){
  var b1=$('alN'),b2=$('alN2');
  if(b1&&b2){b2.hidden=b1.hidden;b2.textContent=b1.textContent}
}
setInterval(syncBadge,500);

/* --- Activate body layout after login --- */
function checkLogin(){
  var lock=$('lock');
  if(lock&&lock.hidden){
    document.body.classList.add('app-ready');
    // Show user management for admin
    if(window.__mirror&&window.__mirror.role==='admin'){
      var usrBtn=$('sbUsrBtn');if(usrBtn)usrBtn.style.display='';
    }
    // Show role in sidebar
    var roleEl=$('sbRole');
    if(roleEl&&window.__mirror){
      roleEl.textContent=window.__mirror.role==='admin'?'مدير':'مشاهد';
    }
    return true;
  }
  return false;
}
var loginCheck=setInterval(function(){if(checkLogin())clearInterval(loginCheck)},300);

/* --- Recommendations Tab --- */
var recLoaded=false;
function loadRecommendations(){
  if(recLoaded)return;
  var sec=$('s-rec');
  if(!sec)return;
  sec.innerHTML='<h2>التوصيات الذكية</h2><p class="note">جاري تحميل التوصيات...</p>';
  var code='';try{code=localStorage.getItem('mm_code')||''}catch(e){}
  if(!code){sec.innerHTML='<h2>التوصيات الذكية</h2><p class="note">يرجى تسجيل الدخول أولاً</p>';return}
  google.script.run.withSuccessHandler(function(data){
    recLoaded=true;
    if(!data||!data.length){
      sec.innerHTML='<h2>التوصيات الذكية</h2><div class="empty-state">لا توجد توصيات حالياً</div>';
      return;
    }
    var html='<h2>التوصيات الذكية</h2>';
    data.forEach(function(r){
      var pri=r.priority||'medium';
      var icon=pri==='high'?'⚠️':pri==='positive'?'✅':'💡';
      html+='<div class="rec-card"><div class="rec-icon '+pri+'">'+icon+'</div><div><div class="rec-prop">'+(r.property||'عام')+'</div><div class="rec-text">'+r.text+'</div></div></div>';
    });
    sec.innerHTML=html;
  }).withFailureHandler(function(err){
    sec.innerHTML='<h2>التوصيات الذكية</h2><p class="err">تعذر تحميل التوصيات: '+String(err&&err.message||err)+'</p>';
  }).getRecommendations(code);
}

/* --- User Management Tab --- */
var usrLoaded=false;
function loadUsers(){
  var sec=$('s-usr');
  if(!sec)return;
  if(!window.__mirror||window.__mirror.role!=='admin'){
    sec.innerHTML='<h2>إدارة المستخدمين</h2><div class="empty-state">هذا القسم للمديرين فقط</div>';
    return;
  }
  var code='';try{code=localStorage.getItem('mm_code')||''}catch(e){}
  sec.innerHTML='<h2>إدارة المستخدمين</h2>'+
  '<div class="usr-form"><label>البريد الإلكتروني<input type="email" id="usrEmail" placeholder="user@example.com" dir="ltr"></label>'+
  '<label>الاسم<input type="text" id="usrName" placeholder="اسم المستخدم"></label>'+
  '<label>الصلاحيات<div class="usr-perms">'+
  '<label><input type="checkbox" value="ov" checked>نظرة عامة</label>'+
  '<label><input type="checkbox" value="y26" checked>التحليل</label>'+
  '<label><input type="checkbox" value="pr">التسعير</label>'+
  '<label><input type="checkbox" value="av">المؤكد والمتاح</label>'+
  '<label><input type="checkbox" value="ota">المنصات</label>'+
  '<label><input type="checkbox" value="al">التنبيهات</label>'+
  '</div></label>'+
  '<label>العقارات<div class="usr-perms" id="usrProps"></div></label>'+
  '<div><button class="btn pri" id="usrInvite" type="button">إرسال دعوة</button></div></div>'+
  '<div id="usrList"><p class="note">جاري تحميل المستخدمين...</p></div>';

  // Load existing users
  google.script.run.withSuccessHandler(function(users){
    usrLoaded=true;
    var list=$('usrList');
    if(!list)return;
    if(!users||!users.length){list.innerHTML='<div class="empty-state">لا يوجد مستخدمين مدعوين</div>';return}
    var html='<div class="tbl"><table><tr><th>الاسم</th><th>البريد</th><th>الصلاحيات</th><th>الحالة</th><th></th></tr>';
    users.forEach(function(u){
      html+='<tr><td>'+u.name+'</td><td dir="ltr">'+u.email+'</td><td>'+(u.perms||[]).join('، ')+'</td><td>'+(u.active?'<span class="pill good">نشط</span>':'<span class="pill">معلق</span>')+'</td><td><button class="btn" data-email="'+u.email+'" onclick="removeUser(this)">حذف</button></td></tr>';
    });
    html+='</table></div>';
    list.innerHTML=html;
  }).withFailureHandler(function(err){
    var list=$('usrList');
    if(list)list.innerHTML='<p class="err">تعذر تحميل المستخدمين</p>';
  }).getUsers(code);

  // Invite button
  setTimeout(function(){
    var invBtn=$('usrInvite');
    if(invBtn)invBtn.addEventListener('click',function(){
      var email=$('usrEmail').value.trim();
      var name=$('usrName').value.trim();
      if(!email){alert('أدخل البريد الإلكتروني');return}
      var perms=[];
      sec.querySelectorAll('.usr-perms input:checked').forEach(function(cb){perms.push(cb.value)});
      invBtn.disabled=true;
      google.script.run.withSuccessHandler(function(){
        invBtn.disabled=false;
        $('usrEmail').value='';$('usrName').value='';
        usrLoaded=false;loadUsers();
      }).withFailureHandler(function(err){
        invBtn.disabled=false;
        alert('خطأ: '+(err&&err.message||err));
      }).inviteUser(code,{email:email,name:name,perms:perms});
    });
  },100);
}
window.removeUser=function(btn){
  if(!confirm('هل تريد حذف هذا المستخدم؟'))return;
  var code='';try{code=localStorage.getItem('mm_code')||''}catch(e){}
  google.script.run.withSuccessHandler(function(){usrLoaded=false;loadUsers()}).removeUser(code,btn.dataset.email);
};
})();
</script>
</body></html>
